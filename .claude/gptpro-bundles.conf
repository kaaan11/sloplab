# sloplab — GPTPro bundle split (by subsystem, not by directory size).
#
# NOTE: root-level arastirma.md and muhendislik.md are deliberately NOT
# exported — scratch working notes, not review material.

define_bundle core "runtime library: corpus loading, mutations, evaluators, scoring, reporting, CLI" \
  dir:src \
  file:pyproject.toml file:uv.lock

define_bundle dataset "benchmark corpus: canonical/adversarial/synthetic cases and manifests" \
  dir:corpus \
  file:docs/dataset-card.md:docs file:docs/corpus-balance-v0.2.md:docs

define_bundle experiments "experiment + benchmark configs, prompts, manifests and result records" \
  dir:experiments \
  dir:benchmarks

define_bundle tests "test suite — the enforced contracts (unit, integration, property, regression)" \
  dir:tests

define_bundle tooling "standalone scripts and CI workflows" \
  dir:scripts \
  dir:.github

define_bundle docs "methodology, evaluator contract, audits, safety/threat model, release history" \
  dir:docs \
  dir:examples \
  file:README.md file:CONTRIBUTING.md file:SECURITY.md file:.gitignore
