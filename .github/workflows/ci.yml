name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
      - name: Validate corpus
        run: uv run sloplab validate corpus/
      - name: BYOE and offline HTML smoke
        run: |
          uv run sloplab benchmark benchmarks/suites/v1-core.yaml \
            --evaluator rules-baseline \
            --evaluator-module examples/my_evaluator.py:make \
            --out "${RUNNER_TEMP}/byoe"
          uv run sloplab report "${RUNNER_TEMP}/byoe/run.jsonl" \
            --format html --out "${RUNNER_TEMP}/byoe/report.html"
          uv run sloplab report "${RUNNER_TEMP}/byoe/run.jsonl" \
            --format html --out "${RUNNER_TEMP}/byoe/report-repeat.html"
          cmp "${RUNNER_TEMP}/byoe/report.html" "${RUNNER_TEMP}/byoe/report-repeat.html"
          git diff --exit-code -- uv.lock
      - name: Retain BYOE smoke report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: byoe-html-smoke
          path: |
            ${{ runner.temp }}/byoe/run.jsonl
            ${{ runner.temp }}/byoe/outcomes.jsonl
            ${{ runner.temp }}/byoe/report.html
          retention-days: 14
