name: Issue 10 workspace export
on:
  push:
    branches: [feat/issue-10-add-report]
    paths: [.github/workflows/issue-10-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6e30a9843321cba8a3178c4cb2a06dcf9b3a3bb
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export source and offline validation tools
        run: |
          mkdir -p /tmp/issue10-export/wheels
          git archive HEAD --format=zip --output=/tmp/issue10-export/source.zip
          python -m pip download --only-binary=:all: --dest /tmp/issue10-export/wheels ruff mypy types-PyYAML
      - uses: actions/upload-artifact@v4
        with:
          name: issue10-validation-workspace
          path: /tmp/issue10-export
          retention-days: 1
