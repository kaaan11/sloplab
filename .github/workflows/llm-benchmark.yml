# MANUAL-ONLY workflow. This file must never gain push/pull_request/schedule
# triggers: live LLM calls cost money and are excluded from all automated flows.
#
# Requirements enforced by design:
# - triggers: workflow_dispatch only
# - execution gated to the "llm-bench" GitHub Environment (which owns the secret)
# - no secrets or raw model responses printed to logs (results go to an artifact)
#
# Budget enforcement (scripts/llm_bench.py, backed by
# experiments/configs/llm-pilot-v0.2.yaml):
# - worst-case requests = max_cases x repeats x (1 + max_retries_per_case) is
#   checked BEFORE any network call; oversized plans exit non-zero without
#   dispatching a single request;
# - every request passes a hard request cap and a minimum-interval pacer that
#   honors HTTP 429 Retry-After;
# - default smoke plan is 3 cases x 1 repeat x 3 attempts <= 9 requests, far
#   below typical free-tier daily limits (e.g. 50/day).

name: llm-benchmark

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Max canonical cases to evaluate (each case costs API tokens)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: llm-bench
    # Smoke plan (<=9 requests, 3 s spacing) finishes in minutes; the full
    # 180-request protocol needs multiple dispatches or a raised timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --group dev

      - name: Verify environment configuration (no values printed)
        env:
          SLOPLAB_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLOPLAB_LLM_MODEL: ${{ vars.LLM_MODEL }}
          SLOPLAB_LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
        run: |
          if [ -z "$SLOPLAB_LLM_API_KEY" ]; then
            echo "::error::secret LLM_API_KEY is not configured on environment 'llm-bench'"
            exit 1
          fi
          if [ -z "$SLOPLAB_LLM_MODEL" ] || [ -z "$SLOPLAB_LLM_ENDPOINT" ]; then
            echo "::error::variables LLM_MODEL / LLM_ENDPOINT are not configured on environment 'llm-bench'"
            exit 1
          fi
          echo "configuration present: key=<redacted>, model=<configured>, endpoint=<configured>"

      - name: Run metered LLM benchmark
        env:
          SLOPLAB_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SLOPLAB_LLM_MODEL: ${{ vars.LLM_MODEL }}
          SLOPLAB_LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          MAX_CASES: ${{ inputs.max_cases }}
        run: |
          # Dispatch input reaches the shell only through this quoted, validated
          # environment variable - never via direct ${{ }} interpolation.
          case "$MAX_CASES" in
            ''|*[!0-9]*)
              echo "::error::max_cases must be a non-negative integer (got '$MAX_CASES')"
              exit 1
              ;;
          esac
          uv run python scripts/llm_bench.py \
            --max-cases "$MAX_CASES" \
            --out llm-bench-results.jsonl

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-bench-results
          path: |
            llm-bench-results.jsonl
            llm-bench-results.bundle/
          retention-days: 30
