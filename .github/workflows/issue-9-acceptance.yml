name: Issue 9 final acceptance

on:
  push:
    branches: [audit/issue-9-final-acceptance-20260926]
    paths: [.github/workflows/issue-9-acceptance.yml]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b3b1190ce20a1aa06a4ffcc2898331544c19e9e
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record tested identity
        run: |
          mkdir -p "$RUNNER_TEMP/epic9"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/epic9/identity.txt"
          test "$(git rev-parse HEAD)" = 0b3b1190ce20a1aa06a4ffcc2898331544c19e9e
          test "$(git rev-parse HEAD^{tree})" = 4dbf7b383b41c1ae1a08527303a7d41d57bea7bd
          git archive --format=zip HEAD > "$RUNNER_TEMP/epic9/source.zip"
          sha256sum uv.lock | tee "$RUNNER_TEMP/epic9/lock-before.txt"
      - name: Locked install
        run: uv sync --locked --group dev 2>&1 | tee "$RUNNER_TEMP/epic9/install.log"
      - name: Lint
        run: uv run ruff check . 2>&1 | tee "$RUNNER_TEMP/epic9/lint.log"
      - name: Format
        run: uv run ruff format --check . 2>&1 | tee "$RUNNER_TEMP/epic9/format.log"
      - name: Types
        run: uv run mypy src tests 2>&1 | tee "$RUNNER_TEMP/epic9/mypy.log"
      - name: Full regression suite
        run: uv run pytest --junitxml="$RUNNER_TEMP/epic9/pytest.xml" 2>&1 | tee "$RUNNER_TEMP/epic9/pytest.log"
      - name: Corpus validation
        run: uv run sloplab validate corpus/ 2>&1 | tee "$RUNNER_TEMP/epic9/corpus.log"
      - name: Base-only package without UI toolkit
        if: matrix.python-version == '3.13'
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/sloplab-base" uv sync --locked --no-dev 2>&1 | tee "$RUNNER_TEMP/epic9/base-install.log"
          "$RUNNER_TEMP/sloplab-base/bin/python" - <<'PY' | tee "$RUNNER_TEMP/epic9/base-check.log"
          import importlib.util
          import sys
          from pathlib import Path
          from sloplab.cli.main import cli
          from click.testing import CliRunner
          assert importlib.util.find_spec('prompt_toolkit') is None
          assert not any(name.startswith(('prompt_toolkit', 'sloplab.tui')) for name in sys.modules)
          result = CliRunner().invoke(cli, ['validate', 'corpus/'])
          assert result.exit_code == 0, result.output
          print(result.output)
          result = CliRunner().invoke(cli, ['add-report', 'corpus/canonical/authz-001/report.md', '--ui'])
          assert result.exit_code != 0, result.output
          assert 'sloplab[ui]' in result.output, result.output
          print(result.output)
          print('BASE_CLI_WITHOUT_UI=PASS; MISSING_EXTRA_MESSAGE=PASS')
          PY
      - name: Console CLI, keyboard TUI and actual PTY smoke on copied corpora
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: .
          TERM: xterm-256color
          PROMPT_TOOLKIT_NO_CPR: '1'
          NO_COLOR: '1'
        run: |
          uv run python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/epic9/smoke.log"
          import asyncio
          import fcntl
          import json
          import os
          import select
          import shutil
          import struct
          import subprocess
          import sys
          import tempfile
          import termios
          import time
          from pathlib import Path
          from sloplab.corpus.loader import discover_fixtures
          from sloplab.corpus.validation import validate_corpus
          from sloplab.models.enums import DIMENSIONS
          from sloplab.models.manifest import CanonicalManifest
          from sloplab.tui.app import Step
          from tests._add_report_helpers import answers, make_source, snapshot
          from tests._tui_helpers import running
          import yaml
          original = Path('corpus').resolve()
          original_before = snapshot(original)
          F7, F8 = '\x1b[18~', '\x1b[19~'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'epic9'
          with tempfile.TemporaryDirectory(prefix='epic9-smoke-') as tmp:
              tmp = Path(tmp)
              source = make_source(tmp, b'# Synthetic boundary report\r\n\r\n## Reproduction Steps\r\n\r\n1. Inspect demo data.\r\n')
              roots = {name: tmp / name for name in ('cli', 'tui', 'pty')}
              for root in roots.values():
                  shutil.copytree(original, root)
              slug = 'epic9-acceptance'
              base_cli = str(Path(os.environ['RUNNER_TEMP']) / 'sloplab-base/bin/sloplab')
              command = [base_cli, 'add-report', str(source.path), '--corpus', str(roots['cli'])]
              proc = subprocess.run(command, input=answers(slug=slug), text=True, capture_output=True, timeout=30)
              (evidence / 'cli-smoke.txt').write_text(proc.stdout + proc.stderr)
              assert proc.returncode == 0, proc.stdout + proc.stderr
              assert 'Fixture added' in proc.stdout
              cli_tree = snapshot(roots['cli'])
              duplicate = subprocess.run(command, input=answers(slug=slug), text=True, capture_output=True, timeout=30)
              assert duplicate.returncode != 0 and snapshot(roots['cli']) == cli_tree
              cancelled = subprocess.run(command, input=answers(slug='epic9-cancel', confirm='n'), text=True, capture_output=True, timeout=30)
              assert cancelled.returncode == 0 and snapshot(roots['cli']) == cli_tree

              async def keyboard_smoke():
                  async with running(source.path, roots['tui']) as driver:
                      ui = driver.ui
                      await driver.keys(slug + F7)
                      assert int(ui.step) == int(Step.GROUND_TRUTH), ui.message
                      await driver.keys('\x1b[A\x1b[A \t\x1b[B \t' + '\x1b[B' * 4 + ' \t')
                      await driver.keys('Synthetic test\tSynthetic only' + F7)
                      assert int(ui.step) == int(Step.EVIDENCE), ui.message
                      await driver.keys(F7)
                      for _ in DIMENSIONS:
                          await driver.keys('\x01\x0b0.9\t')
                      await driver.keys(F7)
                      assert ui.can_create and ui.session.prepared is not None, ui.message
                      assert ui.session.prepared.preflight.render() in ui.review.text
                      assert ui.session.prepared.fixture_validation.render() in ui.review.text
                      await driver.keys(F8)
                      assert not (roots['tui'] / 'canonical' / slug).exists()
                      await driver.keys(' ' + F8)
                      assert int(ui.step) == int(Step.SUCCESS), ui.message
                      result = ui.session.result
                      assert result is not None and result.committed
                      assert ui.session.prepared is None
                      assert result.before_count == 60 and result.validation.checked_canonical == 61
                      (evidence / 'tui-smoke.txt').write_text(ui.success.text)
                      await driver.keys('\x11')
                      assert await driver.task is result
              asyncio.run(keyboard_smoke())

              master, slave = os.openpty()
              fcntl.ioctl(slave, termios.TIOCSWINSZ, struct.pack('HHHH', 40, 120, 0, 0))
              raw = bytearray()
              child = subprocess.Popen([sys.executable, '-m', 'sloplab.cli.main', 'add-report', str(source.path), '--corpus', str(roots['pty']), '--ui'], stdin=slave, stdout=slave, stderr=slave, start_new_session=True)
              os.close(slave)
              def pump(seconds):
                  end = time.monotonic() + seconds
                  while time.monotonic() < end:
                      ready, _, _ = select.select([master], [], [], min(0.05, max(0, end-time.monotonic())))
                      if ready:
                          try:
                              data = os.read(master, 65536)
                          except OSError:
                              break
                          if not data:
                              break
                          raw.extend(data)
              def send(keys):
                  os.write(master, keys.encode())
                  pump(0.5)
              try:
                  pump(1.5)
                  send(slug + F7)
                  send('\x1b[A\x1b[A \t\x1b[B \t' + '\x1b[B' * 4 + ' \t')
                  send('Synthetic test\tSynthetic only' + F7)
                  send(F7)
                  for _ in DIMENSIONS:
                      send('\x01\x0b0.9\t')
                  send(F7)
                  pump(0.5)
                  send(F8)
                  assert not (roots['pty'] / 'canonical' / slug).exists(), 'No approval must not create'
                  send(' ' + F8)
                  end = time.monotonic() + 10
                  while b'Fixture added' not in raw and time.monotonic() < end and child.poll() is None:
                      pump(0.1)
                  send('\x11')
                  assert child.wait(timeout=10) == 0, raw.decode(errors='replace')
                  pump(0.1)
              finally:
                  if child.poll() is None:
                      child.terminate()
                      child.wait(timeout=5)
                  os.close(master)
                  (evidence / 'pty-smoke.txt').write_bytes(raw)

              manifests = []
              summary = {}
              for name, root in roots.items():
                  destination = root / 'canonical' / slug
                  assert destination.is_dir(), name
                  assert (destination / 'report.md').read_bytes() == source.content
                  after = snapshot(root)
                  assert all(after[key] == value for key, value in original_before.items()), name
                  new_keys = set(after) - set(original_before)
                  assert new_keys == {f'canonical/{slug}', f'canonical/{slug}/report.md', f'canonical/{slug}/manifest.yaml'}, new_keys
                  canonical, derived = discover_fixtures(root)
                  validation = validate_corpus(canonical, derived, root)
                  assert validation.ok and len(canonical) == 61 and not validation.warnings
                  manifest_bytes = (destination / 'manifest.yaml').read_bytes()
                  model = CanonicalManifest.model_validate(yaml.safe_load(manifest_bytes))
                  assert model.id == 'canonical-' + slug
                  manifests.append(manifest_bytes)
                  summary[name] = {'canonical_before': 60, 'canonical_after': 61, 'errors': 0, 'warnings': 0}
              assert manifests[0] == manifests[1] == manifests[2], 'CLI/TUI/PTY manifest parity'
              assert source.path.read_bytes() == source.content
              assert not list(tmp.glob('.sloplab-stage-*'))
              assert not list(tmp.glob('.*.sloplab-add-report.lock'))
          assert snapshot(original) == original_before
          summary.update({'report_bytes_identical': True, 'manifest_bytes_identical': True, 'source_preserved': True, 'original_corpus_unchanged': True, 'no_leftover_stage_or_lock': True})
          print(json.dumps(summary, indent=2))
          (evidence / 'smoke-summary.json').write_text(json.dumps(summary, indent=2))
          print('EPIC9_CONSOLE_CLI_KEYBOARD_TUI_PTY_PARITY=PASS')
          PY
      - name: Verify optional extra installed without dev tools
        if: matrix.python-version == '3.13'
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/sloplab-ui" uv sync --locked --no-dev --extra ui 2>&1 | tee "$RUNNER_TEMP/epic9/ui-install.log"
          "$RUNNER_TEMP/sloplab-ui/bin/python" - <<'PY' | tee "$RUNNER_TEMP/epic9/ui-check.log"
          import importlib.util
          from importlib.metadata import version
          from sloplab.tui.app import ReportBuilder
          assert version('prompt-toolkit') == '3.0.52'
          assert importlib.util.find_spec('pytest') is None
          print('OPTIONAL_UI_EXTRA_WITHOUT_DEV=PASS')
          PY
      - name: Source and lock unchanged
        if: always()
        run: |
          git diff --exit-code
          sha256sum uv.lock | tee "$RUNNER_TEMP/epic9/lock-after.txt"
          diff "$RUNNER_TEMP/epic9/lock-before.txt" "$RUNNER_TEMP/epic9/lock-after.txt"
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic9-acceptance-${{ matrix.python-version }}
          path: ${{ runner.temp }}/epic9/
          retention-days: 14
