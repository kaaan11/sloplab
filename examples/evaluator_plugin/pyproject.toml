[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloplab-example-evaluator"
version = "0.1.0"
description = "Constant-review evaluator demonstrating SlopLab entry-point packaging"
requires-python = ">=3.11"
dependencies = ["sloplab>=0.2.2"]

[project.entry-points."sloplab.evaluators"]
example-review-plugin = "sloplab_example_evaluator:make"

[tool.hatch.build.targets.wheel]
packages = ["src/sloplab_example_evaluator"]
