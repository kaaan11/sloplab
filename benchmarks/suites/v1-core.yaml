name: v1-core
description: >
  Full V1 benchmark suite: 60 canonical fixtures (18 valid, 10 standalone invalid,
  16 review, plus 8 presentation pairs as 16 invalid-class files) expanded to
  exactly 237 derived cases after no-op exclusion, for a total of 297 evaluations.
  Counts are enforced against the committed reference run by the documentation
  consistency guard (tests/regression/test_doc_consistency.py).
base_seed: 20260825
corpus_root: corpus
include_canonical_cases: true
policies:
  valid:
    variants_per_fixture: 8
    operators:
      - remove_reproduction_step
      - remove_affected_version
      - impact_inflation
      - scope_expansion
      - invent_api_identifier
      - professionalize_language
      - confidence_overstatement
      - fabricate_reference
      - misattribute_cve
      - impossible_precondition
      - contradict_observed_result
      - add_irrelevant_detail
  invalid:
    variants_per_fixture: 4
    operators:
      - professionalize_language
      - confidence_overstatement
      - add_irrelevant_detail
      - scope_expansion
  review:
    variants_per_fixture: 5
    operators:
      - remove_reproduction_step
      - remove_affected_version
      - confidence_overstatement
      - professionalize_language
      - add_irrelevant_detail
  presentation_pair:
    variants_per_fixture: 1
    operators:
      - professionalize_language
      - confidence_overstatement
