name: v1-core-smoke
description: >
  Small smoke suite over the first 12 canonical fixtures; exercises the full
  materialize -> evaluate -> score pipeline quickly.
base_seed: 20260825
corpus_root: corpus
include_canonical_cases: true
policies:
  valid:
    variants_per_fixture: 3
    operators:
      - remove_reproduction_step
      - remove_affected_version
      - impact_inflation
      - scope_expansion
      - invent_api_identifier
      - professionalize_language
      - confidence_overstatement
  invalid:
    variants_per_fixture: 2
    operators:
      - professionalize_language
      - confidence_overstatement
      - remove_affected_version
  review:
    variants_per_fixture: 2
    operators:
      - remove_reproduction_step
      - confidence_overstatement
